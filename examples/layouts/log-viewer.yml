# Log Viewer Layout
# Multi-log monitoring with env-configurable paths

session:
  name: "logs"
  initial_focus: command

layout:
  type: vertical
  splits:
    - id: command
      size: 20%
      command: "clear && echo 'Set APP_LOG, ERROR_LOG, and ACCESS_LOG or edit the paths below.'"
    - type: horizontal
      size: 80%
      splits:
        - id: app_log
          size: 33%
          command: >-
            sh -lc 'LOG=${APP_LOG:-./logs/app.log}; [ -r "$LOG" ] && tail -F "$LOG" || echo "Set APP_LOG to a readable app log."'
        - id: error_log
          size: 33%
          command: >-
            sh -lc 'LOG=${ERROR_LOG:-./logs/error.log}; [ -r "$LOG" ] && tail -F "$LOG" || echo "Set ERROR_LOG to a readable error log."'
        - id: access_log
          size: 34%
          command: >-
            sh -lc 'LOG=${ACCESS_LOG:-./logs/access.log}; [ -r "$LOG" ] && tail -F "$LOG" || echo "Set ACCESS_LOG to a readable access log."'

# Result:
# |-----------------------------------------------|
# |                   command                     |
# |-----------------------------------------------|
# |  app_log    |  error_log  |    access_log    |
# |-----------------------------------------------|
