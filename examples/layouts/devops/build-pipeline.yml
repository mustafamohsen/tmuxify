# Build Pipeline Workbench
# Local CI/debug command center without assuming a specific provider

session:
  name: "build-pipeline"
  initial_focus: builds

layout:
  type: horizontal
  splits:
    - id: builds
      size: 60%
      command: >-
        sh -lc 'clear; git status --short; echo; echo "CI helpers to try:"; echo "  make test | just ci | npm test | pytest"; echo "  gh run list/watch | glab pipeline list | act -l"'
    - id: pipeline_cmds
      size: 40%
      command: "clear && echo 'Run read-only pipeline/debug commands here. Keep tokens in env vars, not YAML.'"

# Result:
# |------------------------------------------|
# |                      |                   |
# |        builds        |   pipeline_cmds   |
# |    (CI overview)     |    (Commands)     |
# |                      |                   |
# |------------------------------------------|
