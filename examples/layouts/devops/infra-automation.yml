# Infrastructure Automation Layout
# Ansible/Terraform workspace with safe validation-first defaults

session:
  name: "infra-automation"
  initial_focus: ansible

layout:
  type: vertical
  splits:
    - id: ansible
      size: 60%
      command: >-
        sh -lc 'if [ -d ansible ]; then cd ansible && ${EDITOR:-vi} playbooks; else echo "No ./ansible directory; edit this path for your playbooks."; fi'
    - id: terraform
      size: 40%
      command: >-
        sh -lc 'if [ -d terraform ]; then cd terraform && { terraform fmt -check && terraform validate; } || echo "Review backend/workspace before running terraform plan."; else echo "No ./terraform directory; edit this path for your IaC."; fi'

# Result:
# |------------------------------------------|
# |                 ansible                  |
# |            (Ansible playbooks)           |
# |------------------------------------------|
# |                terraform                 |
# |           (fmt / validate first)         |
# |------------------------------------------|
