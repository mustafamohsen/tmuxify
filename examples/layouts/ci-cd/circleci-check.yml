# CircleCI Monitoring Layout
# API v2 starter using environment variables instead of stored tokens

session:
  name: "circleci-check"
  initial_focus: pipeline

layout:
  type: vertical
  splits:
    - id: pipeline
      size: 60%
      command: >-
        sh -lc 'if [ -n "${CIRCLECI_TOKEN:-}" ] && [ -n "${CIRCLECI_PROJECT_SLUG:-}" ]; then curl -fsS -H "Circle-Token: $CIRCLECI_TOKEN" "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/pipeline?branch=${CIRCLE_BRANCH:-main}"; else echo "Set CIRCLECI_TOKEN and CIRCLECI_PROJECT_SLUG, e.g. gh/org/repo. Do not store tokens in YAML."; fi'
    - id: artifacts
      size: 40%
      command: "clear && echo 'Artifacts/tests pane: set a workflow/job ID, then query CircleCI API v2 for test metadata or artifacts.'"

# Result:
# |------------------------------------------|
# |                pipeline                  |
# |           (CircleCI API v2)              |
# |------------------------------------------|
# |                artifacts                 |
# |          (Tests / artifacts notes)       |
# |------------------------------------------|
