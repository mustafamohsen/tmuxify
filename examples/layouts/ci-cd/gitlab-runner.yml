# GitLab CI Monitoring Layout
# Project pipeline status plus optional runner-host view

session:
  name: "gitlab-ci"
  initial_focus: pipeline

layout:
  type: horizontal
  splits:
    - id: pipeline
      size: 60%
      command: >-
        sh -lc 'if command -v glab >/dev/null 2>&1; then glab pipeline list --limit 5; else echo "Install glab or replace with your GitLab pipeline API command."; fi'
    - id: runner
      size: 40%
      command: >-
        sh -lc 'if command -v gitlab-runner >/dev/null 2>&1; then gitlab-runner list; else echo "gitlab-runner is only expected on runner hosts."; fi'

# Result:
# |------------------------------------------|
# |                      |                   |
# |       pipeline       |      runner       |
# |    (Pipeline list)   |  (Runner status)  |
# |                      |                   |
# |------------------------------------------|
