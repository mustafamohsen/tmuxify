# Node.js Backend Development Layout
# Editor, dev server, tests, and optional log tail

session:
  name: "node-backend"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: server
          size: 40%
          command: "sh -lc 'npm run dev || npm start || echo \"No dev/start script found.\"'"
        - id: tests
          size: 30%
          command: "sh -lc 'npm test -- --watch || echo \"Replace with your backend test command.\"'"
        - id: logs
          size: 30%
          command: "sh -lc 'mkdir -p logs && touch logs/server.log && tail -F logs/server.log'"

# Result:
# |------------------------------------------|
# |                      |      server       |
# |                      |-------------------|
# |        editor        |       tests       |
# |                      |-------------------|
# |                      |       logs        |
# |------------------------------------------|
