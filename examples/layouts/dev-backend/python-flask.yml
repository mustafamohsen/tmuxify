# Flask Backend Development Layout
# Editor with Flask server and pytest panes

session:
  name: "flask-backend"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: run_server
          size: 50%
          command: "python -m flask --app app run --debug"
        - id: tests
          size: 50%
          command: "python -m pytest -q --maxfail=1 --disable-warnings"

# Result:
# |------------------------------------------|
# |                      |   run_server      |
# |        editor        |-------------------|
# |                      |      tests        |
# |------------------------------------------|
