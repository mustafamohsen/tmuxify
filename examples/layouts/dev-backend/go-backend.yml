# Go Backend Development Layout
# Editor with run and test panes for a Go module

session:
  name: "go-backend"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 65%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 35%
      splits:
        - id: run_app
          size: 50%
          command: "sh -lc 'go run . || echo \"Replace with your Go entrypoint, e.g. go run ./cmd/api\"'"
        - id: test_app
          size: 50%
          command: "go test ./... -v"

# Result:
# |------------------------------------------|
# |                      |     run_app       |
# |        editor        |-------------------|
# |                      |     test_app      |
# |------------------------------------------|
