# React Development Layout
# Practical React/Vite/Next-style frontend workflow

session:
  name: "react-dev"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: dev_server
          size: 45%
          command: >-
            sh -lc 'npm run dev || npm start || echo "No dev/start script found. Replace with your React command."'
        - id: tests
          size: 35%
          command: >-
            sh -lc 'npm test -- --watch || echo "Replace with vitest --watch, jest --watch, or your test command."'
        - id: browser
          size: 20%
          command: "clear && echo 'Open the URL printed by your React dev server.'"

# Result:
# |------------------------------------------|
# |                      |    dev_server     |
# |                      |-------------------|
# |        editor        |       tests       |
# |                      |-------------------|
# |                      |      browser      |
# |------------------------------------------|
