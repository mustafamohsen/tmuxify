# General Frontend Development Layout
# Editor, dev server, tests, and a browser hint pane

session:
  name: "frontend"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: dev_server
          size: 45%
          command: >-
            sh -lc 'npm run dev || npm start || echo "Replace with your frontend dev-server command."'
        - id: tests
          size: 35%
          command: >-
            sh -lc 'npm test -- --watch || echo "Replace with your test watcher, e.g. vitest --watch."'
        - id: browser
          size: 20%
          command: "clear && echo 'Open the local URL printed by the dev server, often http://localhost:5173 or http://localhost:3000'"

# Result:
# |------------------------------------------|
# |                      |    dev_server     |
# |                      |-------------------|
# |        editor        |       tests       |
# |                      |-------------------|
# |                      |      browser      |
# |------------------------------------------|
