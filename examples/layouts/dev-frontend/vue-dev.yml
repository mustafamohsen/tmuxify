# Vue Development Layout
# Modern Vue/Vite workflow with dev server and tests

session:
  name: "vue-dev"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: dev_server
          size: 45%
          command: >-
            sh -lc 'npm run dev || npm run serve || echo "No Vue dev/serve script found."'
        - id: tests
          size: 35%
          command: >-
            sh -lc 'npm test -- --watch || npm run test:unit -- --watch || echo "Replace with your Vue test command."'
        - id: terminal
          size: 20%
          command: "clear && echo 'Vue shell ready'"

# Result:
# |------------------------------------------|
# |                      |    dev_server     |
# |                      |-------------------|
# |        editor        |       tests       |
# |                      |-------------------|
# |                      |     terminal      |
# |------------------------------------------|
