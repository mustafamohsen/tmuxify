# Classic 4-Pane Layout
# Editor, assistant/scratch pane, Git, and terminal

session:
  name: null
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: assistant
          size: 45%
          command: "clear && echo 'Assistant/scratch pane. Run aider, claude, or notes here when ready.'"
        - type: horizontal
          size: 55%
          splits:
            - id: git
              size: 50%
              command: >-
                sh -lc 'command -v lazygit >/dev/null 2>&1 && exec lazygit || { git status --short; echo; echo "Install lazygit for an interactive Git TUI."; }'
            - id: terminal
              size: 50%
              command: "clear && pwd"

# Result:
# |------------------------------------------------|
# |                       |       assistant        |
# |                       |------------------------|
# |        editor         |    git    | terminal   |
# |                       |           |            |
# |------------------------------------------------|
