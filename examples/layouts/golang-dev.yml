# Go Development Layout
# Editor, shell, test runner, and run pane

session:
  name: "go-dev"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - type: vertical
      size: 70%
      splits:
        - id: editor
          size: 70%
          command: "sh -lc '${EDITOR:-vi} .'"
        - id: terminal
          size: 30%
          command: "clear && go version && pwd"
    - type: vertical
      size: 30%
      splits:
        - id: tests
          size: 50%
          command: "go test ./..."
        - id: run_app
          size: 50%
          command: "sh -lc 'go run . || echo \"Replace with your Go entrypoint, e.g. go run ./cmd/api\"'"

# Result:
# |--------------------------------------------|
# |                            |     tests     |
# |           editor           |---------------|
# |                            |    run_app    |
# |----------------------------|               |
# |          terminal          |               |
# |--------------------------------------------|
