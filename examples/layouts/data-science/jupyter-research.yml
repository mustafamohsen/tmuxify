# Jupyter Research Layout
# Focused notebook, REPL, and data-file workflow

session:
  name: "jupyter-research"
  initial_focus: jupyter

layout:
  type: vertical
  splits:
    - id: jupyter
      size: 70%
      command: "python3 -m jupyter lab --no-browser"
    - type: horizontal
      size: 30%
      splits:
        - id: python_repl
          size: 50%
          command: "python3"
        - id: data_files
          size: 50%
          command: "sh -lc 'python3 --version; command -v python3; if [ -d data ]; then ls -lh data; else echo \"No data/ directory; edit this pane to your dataset path.\"; fi'"

# Result:
# |------------------------------------------|
# |                 jupyter                  |
# |------------------------------------------|
# |     python_repl      |    data_files     |
# |------------------------------------------|
