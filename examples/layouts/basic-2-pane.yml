# Basic 2-Pane Layout
# Minimal editor + shell starter for almost any project

session:
  name: null  # Auto-generate from the current folder path
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - id: terminal
      size: 40%
      command: "clear && pwd && echo 'Ready'"

# Result:
# |---------------------------------|
# |                 |               |
# |                 |               |
# |                 |               |
# |     editor      |   terminal    |
# |                 |               |
# |                 |               |
# |                 |               |
# |---------------------------------|
