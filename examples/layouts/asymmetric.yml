# Asymmetric Layout Demo
# Demonstrates uneven nesting while keeping workflow-oriented pane names

session:
  name: "asymmetric-demo"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 45%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 30%
      splits:
        - id: notes
          size: 30%
          command: "clear && echo 'Notes / docs pane'"
        - type: horizontal
          size: 70%
          splits:
            - id: repl
              size: 50%
              command: "clear && echo 'REPL / scratch pane'"
            - id: tests
              size: 50%
              command: "clear && echo 'Tests pane'"
    - type: vertical
      size: 25%
      splits:
        - id: logs
          size: 65%
          command: "clear && echo 'Logs pane'"
        - id: terminal
          size: 35%
          command: "clear && pwd"

# Result:
# |-----------------------------------------------------------|
# |                  |      notes       |        logs         |
# |                  |------------------|                     |
# |      editor      |   repl  | tests  |---------------------|
# |                  |         |        |      terminal       |
# |-----------------------------------------------------------|
