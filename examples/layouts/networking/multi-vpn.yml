# Multi-VPN Monitoring Layout
# Local VPN status panes with SSH hints for authorized endpoints

session:
  name: "vpn-check"
  initial_focus: vpn1

layout:
  type: horizontal
  splits:
    - id: vpn1
      size: 50%
      command: >-
        sh -lc 'clear; command -v wg >/dev/null 2>&1 && wg show || command -v tailscale >/dev/null 2>&1 && tailscale status || echo "VPN 1: run wg show, tailscale status, or ssh user@vpn1.example.com if authorized."'
    - id: vpn2
      size: 50%
      command: "clear && echo 'VPN 2: replace with your second VPN status command or authorized SSH endpoint.'"

# Result:
# |------------------------------------------|
# |                      |                   |
# |         vpn1         |        vpn2       |
# |    (VPN status)      |    (VPN status)   |
# |                      |                   |
# |------------------------------------------|
