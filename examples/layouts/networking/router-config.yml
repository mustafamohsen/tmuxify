# Router Operations Layout
# Router shell instructions plus log/source hints

session:
  name: "router-config"
  initial_focus: router_shell

layout:
  type: vertical
  splits:
    - id: router_shell
      size: 70%
      command: "clear && echo 'Authorized router console only. Example: ssh admin@router.example.com. Back up config before changes.'"
    - id: logs
      size: 30%
      command: "clear && echo 'Router logs: OpenWrt example: ssh admin@router.example.com logread -f; or tail your central syslog.'"

# Result:
# |------------------------------------------|
# |              router_shell                |
# |------------------------------------------|
# |                  logs                    |
# |------------------------------------------|
