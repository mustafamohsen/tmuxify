# Environment Comparison Layout
# Compare dev, staging, and production environments side by side

session:
  name: "env-compare"
  initial_focus: dev

layout:
  type: horizontal
  splits:
    - id: dev
      size: 33%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 dev.example.com"
    - id: staging
      size: 34%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 staging.example.com"
    - id: production
      size: 33%
      command: "clear && echo '*** PRODUCTION *** verify target before changes'; ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 prod.example.com"

# Result:
# |---------------------------------------|
# |    dev     |  staging   | production  |
# |---------------------------------------|
