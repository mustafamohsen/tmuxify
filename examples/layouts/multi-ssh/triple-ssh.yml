# Bastion SSH Layout
# Three authorized hosts through a bastion/jump host

session:
  name: "bastion-ssh"
  initial_focus: app_a

layout:
  type: horizontal
  splits:
    - id: app_a
      size: 33%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 -J bastion.example.com user@app-a.example.com"
    - id: app_b
      size: 33%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 -J bastion.example.com user@app-b.example.com"
    - id: db_host
      size: 34%
      command: "clear && echo 'Database host - read-only checks first'; ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 -J bastion.example.com user@db.example.com"

# Result:
# |---------------------------------------|
# |   app_a    |   app_b    |   db_host   |
# |---------------------------------------|
