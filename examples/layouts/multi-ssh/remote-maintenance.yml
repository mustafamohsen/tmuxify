# Remote Server Maintenance Layout
# Maintain two authorized remote servers with full-width panes

session:
  name: "remote-maintenance"
  initial_focus: server1

layout:
  type: vertical
  splits:
    - id: server1
      size: 50%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 user@server1.example.com"
    - id: server2
      size: 50%
      command: "ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 user@server2.example.com"

# Result:
# |------------------------------------------|
# |                 server1                  |
# |------------------------------------------|
# |                 server2                  |
# |------------------------------------------|
