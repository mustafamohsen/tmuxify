# Integration Testing Layout
# Runner plus service/log visibility for integration test sessions

session:
  name: "integration-tests"
  initial_focus: runner

layout:
  type: horizontal
  splits:
    - id: runner
      size: 50%
      command: "clear && echo 'Run integration tests here: npm run test:integration, pytest tests/integration, go test ./integration/...'"
    - id: logs
      size: 50%
      command: "sh -lc 'mkdir -p logs && touch logs/integration.log && tail -F logs/integration.log'"

# Result:
# |------------------------------------------|
# |                      |                   |
# |        runner        |       logs        |
# |    (Test runner)     |   (Test logs)     |
# |                      |                   |
# |------------------------------------------|
