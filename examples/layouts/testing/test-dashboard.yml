# Test Dashboard Layout
# Watch tests, coverage, and artifacts from one workspace

session:
  name: "test-dashboard"
  initial_focus: manager

layout:
  type: horizontal
  splits:
    - id: manager
      size: 45%
      command: "clear && echo 'Test commands: npm test, pytest, go test ./..., cypress open, playwright test --ui'"
    - type: vertical
      size: 55%
      splits:
        - id: test_watch
          size: 40%
          command: "sh -lc 'npm test -- --watch || pytest -q || echo \"Replace with your test watcher.\"'"
        - id: coverage
          size: 30%
          command: "sh -lc 'if [ -d coverage ]; then find coverage -maxdepth 2 -type f | head -50; else echo \"Coverage pane: run coverage, then inspect coverage/.\"; fi'"
        - id: artifacts
          size: 30%
          command: >-
            sh -lc 'for d in test-results playwright-report cypress/screenshots cypress/videos; do [ -d "$d" ] && find "$d" -maxdepth 2 -type f | head -50; done; echo "Artifacts pane: reports/screenshots/videos appear here."'

# Result:
# |------------------------------------------|
# |                      |    test_watch     |
# |       manager        |-------------------|
# |                      |     coverage      |
# |                      |-------------------|
# |                      |     artifacts     |
# |------------------------------------------|
