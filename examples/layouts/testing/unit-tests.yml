# Unit Testing Layout
# Focused test-driven development loop

session:
  name: "unit-tests"
  initial_focus: editor

layout:
  type: vertical
  splits:
    - id: editor
      size: 70%
      command: "sh -lc '${EDITOR:-vi} .'"
    - id: run_tests
      size: 30%
      command: >-
        sh -lc 'npm test -- --watch || pytest -q || go test ./... || echo "Replace with your watcher: vitest --watch, cargo watch -x test, etc."'

# Result:
# |------------------------------------------|
# |                 editor                   |
# |------------------------------------------|
# |               run_tests                  |
# |------------------------------------------|
