# Nested Layout Demo
# A deep tmuxify schema demo for advanced development dashboards

session:
  name: "nested-demo"
  initial_focus: main_editor

layout:
  type: vertical
  splits:
    - type: horizontal
      size: 12%
      splits:
        - id: project_overview
          size: 30%
          command: "pwd && git status --short"
        - id: git_status
          size: 30%
          command: "git status"
        - id: system_summary
          size: 20%
          command: "uptime"
        - id: clock
          size: 20%
          command: "date"
    - type: horizontal
      size: 73%
      splits:
        - type: vertical
          size: 60%
          splits:
            - id: main_editor
              size: 70%
              command: "sh -lc '${EDITOR:-vi} .'"
            - id: terminal
              size: 30%
              command: "clear && pwd && echo 'Ready for commands'"
        - type: vertical
          size: 40%
          splits:
            - id: docs
              size: 25%
              command: "clear && echo 'Docs pane: run your docs server or notes here.'"
            - type: horizontal
              size: 45%
              splits:
                - id: test_runner
                  size: 50%
                  command: "clear && echo 'Run tests here, e.g. npm test -- --watch / pytest / go test ./...'"
                - type: vertical
                  size: 50%
                  splits:
                    - id: test_output
                      size: 50%
                      command: "clear && echo 'Test output / failures pane'"
                    - id: coverage
                      size: 50%
                      command: "clear && echo 'Coverage pane: open coverage summary here.'"
            - type: horizontal
              size: 30%
              splits:
                - id: logs
                  size: 50%
                  command: "clear && echo 'Logs pane: tail -F ./logs/app.log'"
                - id: debug
                  size: 50%
                  command: "clear && echo 'Debug / REPL pane'"
    - type: horizontal
      size: 15%
      splits:
        - id: server
          size: 33%
          command: "clear && echo 'Server pane: run your local service here.'"
        - id: database
          size: 33%
          command: "clear && echo 'Database CLI pane: psql/mysql/sqlite/etc.'"
        - id: tasks
          size: 34%
          command: "clear && echo 'Task runner pane: make, just, npm scripts, etc.'"

# Result: deep nested demo with status, editor, tests, logs, and task panes.
