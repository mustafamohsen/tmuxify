# Stream Monitoring Layout
# Chat, encoder logs, and manual OBS/ops notes

session:
  name: "stream-monitor"
  initial_focus: chat

layout:
  type: horizontal
  splits:
    - id: chat
      size: 50%
      command: "clear && echo 'Chat pane: run twitch-tui/chatuino/weechat, or your YouTube chat client.'"
    - type: vertical
      size: 50%
      splits:
        - id: ffmpeg_log
          size: 55%
          command: >-
            sh -lc 'LOG=${FFMPEG_LOG:-./ffmpeg-stream.log}; [ -r "$LOG" ] && tail -F "$LOG" || echo "Set FFMPEG_LOG to your encoder log path."'
        - id: obs_status
          size: 45%
          command: "clear && echo 'OBS controls are manual by design. Suggested read-only checks: obs-cli status; obs-cli scene list; obs-cli stream status.'"

# Result:
# |------------------------------------------|
# |                |        ffmpeg_log       |
# |      chat      |-------------------------|
# |                |        obs_status       |
# |------------------------------------------|
