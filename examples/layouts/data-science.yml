# Data Science Layout
# Jupyter, Python REPL, data browser, shell, and monitor panes

session:
  name: "data"
  initial_focus: jupyter

layout:
  type: vertical
  splits:
    - type: horizontal
      size: 70%
      splits:
        - id: jupyter
          size: 70%
          command: "python3 -m jupyter lab --no-browser"
        - type: vertical
          size: 30%
          splits:
            - id: python_repl
              size: 50%
              command: "python3"
            - id: data_browser
              size: 50%
              command: "sh -lc 'if [ -d data ]; then ls -lah data; else echo \"No data/ directory; edit this pane to your dataset path.\"; fi'"
    - type: horizontal
      size: 30%
      splits:
        - id: terminal
          size: 50%
          command: "clear && pwd && python3 --version"
        - id: monitor
          size: 50%
          command: "sh -lc 'command -v htop >/dev/null 2>&1 && exec htop || exec top'"

# Result:
# |----------------------------------------------|
# |      jupyter          |   python_repl        |
# |      notebook         |----------------------|
# |                       |   data_browser       |
# |----------------------------------------------|
# |      terminal         |      monitor         |
# |----------------------------------------------|
