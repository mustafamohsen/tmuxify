# Server Dashboard Layout
# Logs, shell, metrics, and alerts for a local or remote server workflow

session:
  name: "server-dashboard"
  initial_focus: shell

layout:
  type: horizontal
  splits:
    - type: vertical
      size: 65%
      splits:
        - id: logs
          size: 60%
          command: >-
            sh -lc 'LOG=${SERVER_LOG:-./logs/app.log}; [ -r "$LOG" ] && tail -F "$LOG" || echo "Set SERVER_LOG to a readable log path."'
        - id: shell
          size: 40%
          command: "clear && echo 'Server shell ready. Local shell or run: ssh user@server.example.com'"
    - type: vertical
      size: 35%
      splits:
        - id: metrics
          size: 60%
          command: "sh -lc 'command -v htop >/dev/null 2>&1 && exec htop || exec top'"
        - id: alerts
          size: 40%
          command: "clear && df -h && echo 'Add service health checks or alert commands here.'"

# Result:
# |--------------------------------------------|
# |                         |     metrics      |
# |          logs           |------------------|
# |                         |      alerts      |
# |-------------------------|------------------|
# |          shell          |                  |
# |--------------------------------------------|
