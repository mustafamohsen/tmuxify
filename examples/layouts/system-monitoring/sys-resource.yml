# System Resource Monitoring Layout
# System resources plus readable logs when available

session:
  name: "system-monitor"
  initial_focus: top

layout:
  type: vertical
  splits:
    - id: top
      size: 50%
      command: "sh -lc 'command -v htop >/dev/null 2>&1 && exec htop || exec top'"
    - id: logs
      size: 50%
      command: >-
        sh -lc 'if command -v journalctl >/dev/null 2>&1; then journalctl -f; elif [ -r /var/log/syslog ]; then tail -F /var/log/syslog; elif [ -r /var/log/system.log ]; then tail -F /var/log/system.log; else echo "No readable system log found."; fi'

# Result:
# |------------------------------------------|
# |                   top                    |
# |------------------------------------------|
# |                  logs                    |
# |------------------------------------------|
