# Disk Usage Monitoring Layout
# Monitor disk space and I/O performance with portable fallbacks

session:
  name: "disk-monitor"
  initial_focus: usage

layout:
  type: vertical
  splits:
    - id: usage
      size: 60%
      command: "sh -lc 'while :; do clear; df -h; sleep 2; done'"
    - id: iostat
      size: 40%
      command: "sh -lc 'command -v iostat >/dev/null 2>&1 && iostat -x 5 || echo \"iostat not installed or unsupported on this OS.\"'"

# Result:
# |------------------------------------------|
# |                  usage                   |
# |------------------------------------------|
# |                 iostat                   |
# |------------------------------------------|
