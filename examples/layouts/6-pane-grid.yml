# 6-Pane Workbench Demo
# A 2x3 geometry demo with workflow-oriented pane names

session:
  name: "grid-demo"
  initial_focus: editor

layout:
  type: vertical
  splits:
    - type: horizontal
      size: 50%
      splits:
        - id: editor
          size: 40%
          command: "sh -lc '${EDITOR:-vi} .'"
        - id: server
          size: 30%
          command: "clear && echo 'Server pane: run your dev server here.'"
        - id: tests
          size: 30%
          command: "clear && echo 'Tests pane: run your watcher here.'"
    - type: horizontal
      size: 50%
      splits:
        - id: git
          size: 33%
          command: "git status --short"
        - id: logs
          size: 33%
          command: "clear && echo 'Logs pane: tail -F your app logs here.'"
        - id: terminal
          size: 34%
          command: "clear && pwd"

# Result:
# |-----------------------------------------------|
# |      editor      |    server    |    tests    |
# |-----------------------------------------------|
# |       git        |     logs     |  terminal   |
# |-----------------------------------------------|
