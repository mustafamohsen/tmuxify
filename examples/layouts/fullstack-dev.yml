# Fullstack Development Layout
# One editor with backend/frontend servers and test/ops panes

session:
  name: "fullstack"
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: backend_server
          size: 30%
          command: >-
            sh -lc 'if [ -d backend ]; then cd backend && npm run dev; else echo "No backend/ directory. Replace this with your API command."; fi'
        - id: frontend_server
          size: 30%
          command: >-
            sh -lc 'if [ -d frontend ]; then cd frontend && npm run dev; else echo "No frontend/ directory. Replace this with your web command."; fi'
        - id: tests
          size: 25%
          command: >-
            sh -lc 'if [ -d backend ]; then cd backend && npm test -- --watch; else echo "Tests pane: run npm test, pytest, go test, etc."; fi'
        - id: terminal
          size: 15%
          command: "clear && pwd && echo 'Fullstack shell ready'"

# Result:
# |--------------------------------------------------|
# |                            |   backend_server    |
# |                            |---------------------|
# |                            |   frontend_server   |
# |           editor           |---------------------|
# |                            |        tests        |
# |                            |---------------------|
# |                            |       terminal      |
# |--------------------------------------------------|
