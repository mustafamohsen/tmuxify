# Basic 3-Pane Layout
# Editor with Git status/TUI and a working shell

session:
  name: null
  initial_focus: editor

layout:
  type: horizontal
  splits:
    - id: editor
      size: 60%
      command: "sh -lc '${EDITOR:-vi} .'"
    - type: vertical
      size: 40%
      splits:
        - id: git
          size: 40%
          command: >-
            sh -lc 'command -v lazygit >/dev/null 2>&1 && exec lazygit || { git status --short; echo; echo "Install lazygit for an interactive Git TUI."; }'
        - id: terminal
          size: 60%
          command: "clear && pwd && echo 'Ready'"

# Result:
# |---------------------------------|
# |                 |               |
# |                 |     git       |
# |                 |               |
# |     editor      |---------------|
# |                 |               |
# |                 |   terminal    |
# |                 |               |
# |---------------------------------|
