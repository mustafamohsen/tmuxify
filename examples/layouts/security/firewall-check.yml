# Firewall Review Layout
# Read-only firewall inspection commands with manual privilege escalation

session:
  name: "firewall-check"
  initial_focus: rules

layout:
  type: vertical
  splits:
    - id: rules
      size: 60%
      command: "clear && echo 'Firewall rules often require privileges. Run manually: sudo iptables -nvL --line-numbers or sudo nft list ruleset'"
    - id: ufw
      size: 40%
      command: "clear && echo 'UFW status: run sudo ufw status verbose on hosts that use UFW.'"

# Result:
# |------------------------------------------|
# |                  rules                   |
# |------------------------------------------|
# |                   ufw                    |
# |------------------------------------------|
