name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck curl
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: ShellCheck
        run: shellcheck tmuxify completions/tmuxify.bash tests/*.sh

      - name: Run integration tests
        run: tests/run.sh

  completion-bash32:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exercise completion on the advertised Bash baseline
        shell: /bin/bash {0}
        run: |
          test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2
          /bin/bash -n tmuxify completions/tmuxify.bash
          /bin/bash tests/completion-test.sh
